<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>iPhone Use</title>
  <defs>
    <linearGradient id="tile" x1="84" y1="24" x2="408" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#484848"/>
      <stop offset=".5" stop-color="#383838"/>
      <stop offset="1" stop-color="#2d2d2d"/>
    </linearGradient>
    <linearGradient id="rim" x1="256" y1="24" x2="256" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="rear" x1="154" y1="78" x2="300" y2="374" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bcbcbc"/>
      <stop offset="1" stop-color="#989898"/>
    </linearGradient>
    <linearGradient id="glass" x1="218" y1="138" x2="358" y2="434" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".94"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f1f1f1" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="glass-rim" x1="210" y1="138" x2="364" y2="434" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".38"/>
    </linearGradient>
    <filter id="tile-shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity=".18"/>
    </filter>
    <filter id="rear-shadow" x="108" y="58" width="234" height="356" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity=".3"/>
    </filter>
    <filter id="glass-shadow" x="176" y="122" width="226" height="346" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="117" fill="url(#tile)" stroke="url(#rim)" stroke-width="2" filter="url(#tile-shadow)"/>
  <rect x="138" y="78" width="174" height="296" rx="34" fill="url(#rear)" filter="url(#rear-shadow)"/>
  <rect x="139.5" y="79.5" width="171" height="293" rx="32.5" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="1.5"/>
  <rect x="200" y="138" width="174" height="296" rx="36" fill="url(#glass)" stroke="url(#glass-rim)" stroke-width="3.5" filter="url(#glass-shadow)"/>
  <rect x="255" y="411" width="64" height="7" rx="3.5" fill="#373737" fill-opacity=".65"/>
</svg>
